<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novo item — wonuskiz-mail</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
</head>
<body class="dark">
  <nav class="navbar">
    <a href="dashboard.html" class="navbar-logo">wonuskiz <span class="navbar-badge">mail ✦</span></a>
    <div class="navbar-links">
      <a href="dashboard.html" class="navbar-link">dashboard</a>
      <a href="configuracoes.html" class="navbar-link">configurações</a>
      <button class="theme-toggle" id="theme-toggle" onclick="Theme.toggle()"><i class="ti ti-sun"></i><span>light</span></button>
      <div class="navbar-avatar-wrap">
        <div class="navbar-avatar" id="user-avatar" onclick="toggleAvatarMenu()" title="Perfil">l</div>
        <div class="avatar-menu" id="avatar-menu">
          <a href="perfil.html" class="avatar-menu-item"><i class="ti ti-user"></i> Meu perfil</a>
          <div class="avatar-menu-sep"></div>
          <button class="avatar-menu-item danger" onclick="Auth.logout()"><i class="ti ti-logout"></i> Sair</button>
        </div>
      </div>
    </div>
  </nav>

  <div class="main">
    <div class="breadcrumb">
      <a href="dashboard.html">dashboard</a>
      <span class="breadcrumb-sep">›</span>
      <a href="#" id="bc-caixinha">caixinha</a>
      <span class="breadcrumb-sep">›</span>
      <span id="bc-current">Novo item</span>
    </div>

    <div class="page-header">
      <div class="page-eyebrow">✦ itens do envio</div>
      <h1 class="page-title" id="page-title">Cadastrar item</h1>
      <p class="page-sub" id="page-sub"></p>
    </div>

    <div style="max-width:640px;padding:0 20px 40px">

      <!-- FOTO -->
      <div class="form-section">
        <div class="form-section-title">Foto</div>
        <div id="upload-zone" class="upload-zone" onclick="document.getElementById('file-input').click()">
          <i class="ti ti-cloud-upload upload-icon"></i>
          <span class="upload-txt">Clique para enviar uma foto</span>
          <span class="upload-sub">PNG, JPG até 10MB · salvo no seu Google Drive</span>
        </div>
        <div id="upload-preview" class="upload-preview" style="display:none">
          <div class="preview-thumb" id="preview-img"><i class="ti ti-photo"></i></div>
          <div class="preview-info">
            <span class="preview-name" id="preview-name"></span>
            <span class="preview-size" id="preview-size"></span>
            <button class="preview-remove" onclick="removePhoto()">
              <i class="ti ti-x"></i> Remover
            </button>
          </div>
        </div>
        <input type="file" id="file-input" accept="image/*" style="display:none" onchange="onFileSelect(this)">
      </div>

      <!-- CLASSIFICAÇÃO -->
      <div class="form-section">
        <div class="form-section-title">Classificação</div>
        <div class="form-grid">
          <div class="form-field">
            <label class="form-label">Tipo de item <span class="req">*</span></label>
            <div class="combo-wrap">
              <input type="text" id="tipo_item" class="form-input" placeholder="Photocard, Álbum..." style="padding-right:32px">
              <i class="ti ti-chevron-down combo-arrow"></i>
              <div class="combo-dropdown" id="combo-tipo-item"></div>
            </div>
          </div>
          <div class="form-field">
            <label class="form-label">Tipo de CEG <span class="req">*</span></label>
            <div class="combo-wrap">
              <input type="text" id="tipo_ceg" class="form-input" placeholder="Caixinha Mercari, CEG Inter..." style="padding-right:32px">
              <i class="ti ti-chevron-down combo-arrow"></i>
              <div class="combo-dropdown" id="combo-tipo-ceg"></div>
            </div>
          </div>
          <div class="form-field">
            <label class="form-label">Nome da CEG <span class="req">*</span></label>
            <div class="combo-wrap">
              <input type="text" id="nome_ceg" class="form-input" placeholder="Caixinha Mercari | Agosto..." style="padding-right:32px">
              <i class="ti ti-chevron-down combo-arrow"></i>
              <div class="combo-dropdown" id="combo-nome-ceg"></div>
            </div>
          </div>
          <div class="form-field">
            <label class="form-label">Nome do set <span class="req">*</span></label>
            <div class="combo-wrap">
              <input type="text" id="nome_set" class="form-input" placeholder="Pedido Individual, POB Aladin..." style="padding-right:32px">
              <i class="ti ti-chevron-down combo-arrow"></i>
              <div class="combo-dropdown" id="combo-nome-set"></div>
            </div>
            <span class="form-hint">Digite livremente ou escolha uma opção</span>
          </div>
        </div>
      </div>

      <!-- DETALHES -->
      <div class="form-section">
        <div class="form-section-title">Detalhes</div>
        <div class="form-grid">
          <div class="form-field">
            <label class="form-label">Linha / Nº do set</label>
            <input type="text" id="linha_ref" class="form-input" placeholder="Ex: m93, B34, Set 5...">
          </div>
          <div class="form-field">
            <label class="form-label">Quantidade <span class="req">*</span></label>
            <div class="qty-wrap">
              <button class="qty-btn qty-minus">−</button>
              <input type="number" id="quantidade" class="qty-input" value="1" min="1">
              <button class="qty-btn qty-plus">+</button>
            </div>
          </div>
          <div class="form-field full">
            <label class="form-label">Membro(s)</label>
            <input type="text" id="membro" class="form-input" placeholder="Ex: Seungmin, Bang Chan e Han...">
          </div>
          <div class="form-field full">
            <label class="form-label">Claim</label>
            <input type="text" id="claim" class="form-input" placeholder="Ex: Cards 3, 5, 8 · Bang Chan e Han Jisung...">
          </div>
        </div>
      </div>

      <div class="form-actions">
        <button class="btn btn-danger" id="delete-btn" style="display:none" onclick="confirmDelete()">
          <i class="ti ti-trash"></i> Excluir item
        </button>
        <div id="delete-confirm" style="display:none;align-items:center;gap:8px;flex-wrap:wrap">
          <span style="font-size:13px;color:var(--tx)">Excluir este item?</span>
          <button class="btn btn-sm" style="background:#C0392B;color:#fff;border:none;padding:6px 14px;border-radius:8px;font-size:13px;cursor:pointer" onclick="deleteItem()">Excluir</button>
          <button class="btn btn-ghost btn-sm" style="padding:6px 14px;font-size:13px" onclick="cancelDelete()">Cancelar</button>
        </div>
        <span style="flex:1"></span>
        <a href="#" id="cancel-btn" class="btn btn-ghost">Cancelar</a>
        <button class="btn btn-primary" id="save-btn" onclick="save()">
          <i class="ti ti-check"></i> <span id="save-label">Salvar item</span>
        </button>
      </div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/sheets.js"></script>
  <script src="js/drive.js"></script>
  <script src="js/auth.js"></script>
  <script>
    Theme.init()
    if (!Auth.requireAuth()) throw new Error('Not authenticated')

    function toggleAvatarMenu() {
      document.getElementById('avatar-menu').classList.toggle('open')
    }
    document.addEventListener('click', e => {
      if (!e.target.closest('.navbar-avatar-wrap')) {
        const m = document.getElementById('avatar-menu')
        if (m) m.classList.remove('open')
      }
    })

    const params = new URLSearchParams(location.search)
    const caixinhaId = params.get('caixinha_id')
    const editId = params.get('id')
    let fotoBase64 = null
    let fotoNome = null
    let fotoUrlExistente = null

    async function init() {
      if (!caixinhaId && !editId) { location.href = 'dashboard.html'; return }

      const config = await Sheets.getConfig()
      setupCombo(document.getElementById('tipo_item'), document.getElementById('combo-tipo-item'), config.tipo_item || [])
      setupCombo(document.getElementById('tipo_ceg'), document.getElementById('combo-tipo-ceg'), config.tipo_ceg || [])
      setupCombo(document.getElementById('nome_ceg'), document.getElementById('combo-nome-ceg'), config.nome_ceg || [])
      setupCombo(document.getElementById('nome_set'), document.getElementById('combo-nome-set'), config.nome_set || [])
      setupQty(document.getElementById('quantidade'))

      if (caixinhaId) {
        const c = await Sheets.getCaixinha(caixinhaId)
        const nome = c ? c.nome : 'Caixinha'
        document.getElementById('page-sub').textContent = nome
        document.getElementById('bc-caixinha').href = `caixinha.html?id=${caixinhaId}`
        document.getElementById('bc-caixinha').textContent = nome
        document.getElementById('cancel-btn').href = `caixinha.html?id=${caixinhaId}`
      }

      if (editId) {
        document.getElementById('page-title').textContent = 'Editar item'
        document.getElementById('bc-current').textContent = 'Editar item'
        document.getElementById('save-label').textContent = 'Salvar alterações'
        document.getElementById('delete-btn').style.display = 'inline-flex'
        const rows = await Sheets.getRange('Itens', 'A2:L1000')
        const row = rows.find(r => r[0] === editId)
        if (row) {
          document.getElementById('tipo_item').value = row[3] || ''
          document.getElementById('tipo_ceg').value = row[4] || ''
          document.getElementById('nome_ceg').value = row[5] || ''
          document.getElementById('nome_set').value = row[6] || ''
          document.getElementById('linha_ref').value = row[7] || ''
          document.getElementById('claim').value = row[8] || ''
          document.getElementById('quantidade').value = row[9] || 1
          document.getElementById('membro').value = row[11] || ''
          if (row[2]) {
            fotoUrlExistente = row[2]
            showPhotoPreview(row[2], 'foto existente', '')
          }
          document.getElementById('cancel-btn').href = `caixinha.html?id=${row[1]}`
        }
      }
    }

    function onFileSelect(input) {
      const file = input.files[0]
      if (!file) return
      if (file.size > 10 * 1024 * 1024) {
        showToast('Imagem muito grande! Máximo 10MB', 'error')
        return
      }
      fotoNome = file.name
      const reader = new FileReader()
      reader.onload = (e) => {
        fotoBase64 = e.target.result
        showPhotoPreview(fotoBase64, file.name, (file.size / 1024).toFixed(0) + ' KB')
      }
      reader.readAsDataURL(file)
    }

    function showPhotoPreview(src, name, size) {
      document.getElementById('upload-zone').style.display = 'none'
      document.getElementById('upload-preview').style.display = 'flex'
      document.getElementById('preview-img').innerHTML = `<img src="${src}" alt="preview">`
      document.getElementById('preview-name').textContent = name
      document.getElementById('preview-size').textContent = size
    }

    function removePhoto() {
      fotoBase64 = null
      fotoNome = null
      fotoUrlExistente = null
      document.getElementById('upload-zone').style.display = 'flex'
      document.getElementById('upload-preview').style.display = 'none'
      document.getElementById('file-input').value = ''
    }

    async function save() {
      const btn = document.getElementById('save-btn')
      const tipo_item = document.getElementById('tipo_item').value.trim()
      const tipo_ceg = document.getElementById('tipo_ceg').value.trim()
      const nome_ceg = document.getElementById('nome_ceg').value.trim()
      const nome_set = document.getElementById('nome_set').value.trim()

      if (!tipo_item || !tipo_ceg || !nome_ceg || !nome_set) {
        showToast('Preencha todos os campos obrigatórios', 'error')
        return
      }

      btn.disabled = true

      try {
        // Upload da foto para o Drive se tiver nova
        let fotoUrl = fotoUrlExistente || ''
        if (fotoBase64) {
          btn.innerHTML = '<i class="ti ti-loader ti-spin"></i> Enviando foto...'
          fotoUrl = await Drive.uploadImage(fotoBase64, fotoNome || `item_${Date.now()}.jpg`)
        }

        btn.innerHTML = '<i class="ti ti-loader ti-spin"></i> Salvando...'

        const data = {
          caixinha_id: caixinhaId,
          foto_url: fotoUrl,
          tipo_item, tipo_ceg, nome_ceg, nome_set,
          linha_ref: document.getElementById('linha_ref').value.trim(),
          claim: document.getElementById('claim').value.trim(),
          quantidade: parseInt(document.getElementById('quantidade').value) || 1,
          membro: document.getElementById('membro').value.trim()
        }

        if (editId) {
          const rows = await Sheets.getRange('Itens', 'A2:L1000')
          const row = rows.find(r => r[0] === editId)
          data.caixinha_id = row ? row[1] : caixinhaId
          data.separado = row ? row[10] === 'TRUE' : false
          await Sheets.updateItem(editId, data)
          showToast('Item atualizado!')
          setTimeout(() => { location.href = `caixinha.html?id=${data.caixinha_id}` }, 800)
        } else {
          await Sheets.createItem(data)
          showToast('Item cadastrado!')
          setTimeout(() => { location.href = `caixinha.html?id=${caixinhaId}` }, 800)
        }
      } catch(e) {
        console.error(e)
        showToast('Erro ao salvar: ' + e.message, 'error')
        btn.disabled = false
        btn.innerHTML = '<i class="ti ti-check"></i> <span id="save-label">Salvar item</span>'
      }
    }

    function confirmDelete() {
      document.getElementById('delete-btn').style.display = 'none'
      const conf = document.getElementById('delete-confirm')
      conf.style.display = 'flex'
    }

    function cancelDelete() {
      document.getElementById('delete-confirm').style.display = 'none'
      document.getElementById('delete-btn').style.display = 'inline-flex'
    }

    async function deleteItem() {
      try {
        await Sheets.deleteItem(editId)
        showToast('Item excluído!')
        const rows = await Sheets.getRange('Itens', 'A2:B1000').catch(() => [])
        const row = rows.find(r => r[0] === editId)
        const destId = (row && row[1]) || caixinhaId
        setTimeout(() => { location.href = `caixinha.html?id=${destId}` }, 800)
      } catch(e) {
        showToast('Erro ao excluir', 'error')
        cancelDelete()
      }
    }

    init()
  </script>
</body>
</html>
