<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reparar planilha — wonuskiz-mail</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
</head>
<body class="dark">
  <nav class="navbar">
    <a href="dashboard.html" class="navbar-logo">wonuskiz <span class="navbar-badge">mail ✦</span></a>
  </nav>

  <div class="main" style="padding:40px 20px;max-width:520px">
    <div class="page-header">
      <div class="page-eyebrow">✦ manutenção</div>
      <h1 class="page-title">Reparar planilha</h1>
      <p class="page-sub">Corrige cabeçalhos e estrutura das abas</p>
    </div>

    <div id="status-area" style="margin-top:24px;display:flex;flex-direction:column;gap:12px">
      <div id="s-caixinhas" style="background:var(--sf);border:1.5px solid var(--bo);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px">
        <i class="ti ti-circle" style="color:var(--ts);font-size:18px" id="ic-caixinhas"></i>
        <div>
          <div style="font-weight:700;color:var(--tx)">Aba Caixinhas</div>
          <div style="font-size:12px;color:var(--ts)" id="msg-caixinhas">aguardando...</div>
        </div>
      </div>
      <div id="s-itens" style="background:var(--sf);border:1.5px solid var(--bo);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px">
        <i class="ti ti-circle" style="color:var(--ts);font-size:18px" id="ic-itens"></i>
        <div>
          <div style="font-weight:700;color:var(--tx)">Aba Itens</div>
          <div style="font-size:12px;color:var(--ts)" id="msg-itens">aguardando...</div>
        </div>
      </div>
      <div id="s-config" style="background:var(--sf);border:1.5px solid var(--bo);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px">
        <i class="ti ti-circle" style="color:var(--ts);font-size:18px" id="ic-config"></i>
        <div>
          <div style="font-weight:700;color:var(--tx)">Aba Config</div>
          <div style="font-size:12px;color:var(--ts)" id="msg-config">aguardando...</div>
        </div>
      </div>
    </div>

    <div id="result" style="display:none;margin-top:20px"></div>

    <div style="margin-top:24px;display:flex;gap:10px">
      <button class="btn btn-primary" id="repair-btn" onclick="repair()">
        <i class="ti ti-tool"></i> Reparar agora
      </button>
      <a href="dashboard.html" class="btn btn-ghost">Voltar</a>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/sheets.js"></script>
  <script src="js/auth.js"></script>
  <script>
    Theme.init()
    if (!Auth.requireAuth()) throw new Error('Not authenticated')

    function setStatus(id, icon, color, msg) {
      document.getElementById(`ic-${id}`).className = `ti ${icon}`
      document.getElementById(`ic-${id}`).style.color = color
      document.getElementById(`msg-${id}`).textContent = msg
    }

    async function repair() {
      const btn = document.getElementById('repair-btn')
      btn.disabled = true
      btn.innerHTML = '<i class="ti ti-loader ti-spin"></i> Reparando...'

      // 1. Caixinhas
      setStatus('caixinhas', 'ti-loader ti-spin', 'var(--pu)', 'corrigindo cabeçalho...')
      try {
        await Sheets.setRange('Caixinhas', 'A1:H1', [[
          'id','nome','comunidade','data_pedido','data_envio',
          'transportadora','codigo_rastreio','status'
        ]])
        setStatus('caixinhas', 'ti-circle-check', '#3edc78', 'cabeçalho OK ✓')
      } catch(e) {
        setStatus('caixinhas', 'ti-circle-x', '#e74c3c', 'erro: ' + e.message)
      }

      // 2. Itens
      setStatus('itens', 'ti-loader ti-spin', 'var(--pu)', 'corrigindo cabeçalho...')
      try {
        await Sheets.setRange('Itens', 'A1:K1', [[
          'id','caixinha_id','foto_url','tipo_item','tipo_ceg',
          'nome_ceg','nome_set','linha_ref','claim','quantidade','separado'
        ]])
        setStatus('itens', 'ti-circle-check', '#3edc78', 'cabeçalho OK ✓')
      } catch(e) {
        setStatus('itens', 'ti-circle-x', '#e74c3c', 'erro: ' + e.message)
      }

      // 3. Config
      setStatus('config', 'ti-loader ti-spin', 'var(--pu)', 'corrigindo cabeçalho...')
      try {
        await Sheets.setRange('Config', 'A1:B1', [['tipo','valor']])
        // Verifica se tem dados padrão
        const rows = await Sheets.getRange('Config', 'A2:B2')
        if (rows.length === 0) {
          const defaults = [
            ['tipo_item','Photocard'],['tipo_item','Álbum'],['tipo_item','Cacareco'],
            ['tipo_ceg','Caixinha Mercari'],['tipo_ceg','CEG Inter'],
            ['nome_set','Pedido Individual']
          ]
          for (const row of defaults) await Sheets.appendRow('Config', row)
          setStatus('config', 'ti-circle-check', '#3edc78', 'cabeçalho + dados padrão OK ✓')
        } else {
          setStatus('config', 'ti-circle-check', '#3edc78', 'cabeçalho OK ✓')
        }
      } catch(e) {
        setStatus('config', 'ti-circle-x', '#e74c3c', 'erro: ' + e.message)
      }

      // Resultado
      const result = document.getElementById('result')
      result.style.display = 'block'
      result.innerHTML = `
        <div style="background:rgba(62,220,120,.1);border:1.5px solid rgba(62,220,120,.4);border-radius:12px;padding:14px 16px;color:#3edc78;font-weight:600;display:flex;align-items:center;gap:8px">
          <i class="ti ti-check"></i> Planilha reparada! Agora pode usar o app normalmente.
        </div>`

      btn.innerHTML = '<i class="ti ti-check"></i> Concluído'

      setTimeout(() => { window.location.href = 'dashboard.html' }, 2500)
    }
  </script>
</body>
</html>
