<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caixinha — wonuskiz-mail</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
</head>
<body class="dark">
  <nav class="navbar">
    <a href="dashboard.html" class="navbar-logo">wonuskiz <span class="navbar-badge">mail ✦</span></a>
    <div class="navbar-links">
      <a href="dashboard.html" class="navbar-link">dashboard</a>
      <a href="configuracoes.html" class="navbar-link">configurações</a>
      <button class="theme-toggle" id="theme-toggle" onclick="Theme.toggle()"><i class="ti ti-sun"></i><span>light</span></button>
      <div class="navbar-avatar-wrap">
        <div class="navbar-avatar" id="user-avatar" onclick="toggleAvatarMenu()" title="Perfil">l</div>
        <div class="avatar-menu" id="avatar-menu">
          <a href="perfil.html" class="avatar-menu-item"><i class="ti ti-user"></i> Meu perfil</a>
          <div class="avatar-menu-sep"></div>
          <button class="avatar-menu-item danger" onclick="Auth.logout()"><i class="ti ti-logout"></i> Sair</button>
        </div>
      </div>
    </div>
  </nav>

  <div class="main">
    <div class="breadcrumb">
      <a href="dashboard.html">dashboard</a>
      <span class="breadcrumb-sep">›</span>
      <span id="bc-nome">...</span>
    </div>

    <div id="loading" class="loading"><i class="ti ti-loader ti-spin"></i> Carregando...</div>

    <!-- HEADER DA CAIXINHA -->
    <div id="caixinha-header" style="display:none">
      <div class="gom-hero">
        <div class="gom-owner" id="h-comunidade"></div>
        <div class="gom-title" id="h-nome"></div>
        <div class="gom-chips" id="h-chips"></div>
      </div>

      <div class="cx-info-band">
        <div class="cx-status-row">
          <span class="cx-status-label">status da caixinha</span>
          <span id="h-status"></span>
        </div>
        <div class="cx-info-grid">
          <div class="cx-info-cell">
            <span class="cx-info-lbl">pedido em</span>
            <span class="cx-info-val" id="h-data-pedido">—</span>
          </div>
          <div class="cx-info-cell" id="h-tipo-envio-cell">
            <span class="cx-info-lbl">tipo de envio</span>
            <span class="cx-info-val" id="h-tipo-envio">—</span>
          </div>
          <div class="cx-info-cell">
            <span class="cx-info-lbl">transportadora</span>
            <span class="cx-info-val" id="h-transportadora">—</span>
          </div>
          <div class="cx-info-cell">
            <span class="cx-info-lbl">rastreamento</span>
            <span id="h-rastreio-wrap">—</span>
          </div>
        </div>
      </div>

      <div style="padding:12px 20px;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--bo)">
        <button class="btn btn-ghost btn-sm" onclick="copyPublicLink()"><i class="ti ti-copy"></i> Copiar link público</button>
        <a href="#" id="edit-link" class="btn btn-ghost btn-sm"><i class="ti ti-edit"></i> Editar caixinha</a>
        <a href="#" id="new-item-link" class="btn btn-primary btn-sm"><i class="ti ti-plus"></i> Novo item</a>
      </div>
    </div>

    <div class="section" id="items-section" style="display:none">
      <div class="section-header">
        <div class="section-label">itens da caixinha</div>
        <div class="view-toggle">
          <button class="vt-btn active" id="btn-acc" onclick="setView('acc')"><i class="ti ti-layout-list"></i></button>
          <button class="vt-btn" id="btn-grid" onclick="setView('grid')"><i class="ti ti-layout-grid"></i></button>
        </div>
      </div>

      <!-- ACCORDION -->
      <div id="acc-view"></div>

      <!-- GRADE -->
      <div id="grid-view" class="items-grid h"></div>
    </div>

    <div id="empty-items" class="empty-state" style="display:none">
      <div class="empty-icon"><i class="ti ti-photo"></i></div>
      <div class="empty-title">Nenhum item ainda</div>
      <div class="empty-sub">Adicione os primeiros itens desta caixinha!</div>
      <a href="#" id="empty-new-item" class="btn btn-primary"><i class="ti ti-plus"></i> Novo item</a>
    </div>

    <div class="orn">✦ &nbsp; wonuskiz mail &nbsp; ♡</div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/sheets.js"></script>
  <script src="js/auth.js"></script>
  <script>
    Theme.init()
    if (!Auth.requireAuth()) throw new Error('Not authenticated')

    function toggleAvatarMenu() {
      document.getElementById('avatar-menu').classList.toggle('open')
    }
    document.addEventListener('click', e => {
      if (!e.target.closest('.navbar-avatar-wrap')) {
        const m = document.getElementById('avatar-menu')
        if (m) m.classList.remove('open')
      }
    })

    const params = new URLSearchParams(location.search)
    const caixinhaId = params.get('id')
    if (!caixinhaId) location.href = 'dashboard.html'

    const STATUS_CFG = {
      accumulating:  { label: 'Acumulando',        cls: 'stamp-accumulating' },
      waiting_quote: { label: 'Aguardando cotação', cls: 'stamp-waiting-quote' },
      waiting_send:  { label: 'Aguardando envio',  cls: 'stamp-waiting-send' },
      posted:        { label: 'Postado',            cls: 'stamp-posted' },
      transit:       { label: 'Em trânsito',        cls: 'stamp-transit' },
      received:      { label: 'Recebido',           cls: 'stamp-received' },
    }

    let caixinha, itens = [], currentView = localStorage.getItem('wm-item-view') || 'acc'

    async function load() {
      try {
        caixinha = await Sheets.getCaixinha(caixinhaId)
        itens = await Sheets.getItens(caixinhaId)
        if (!caixinha) { location.href = 'dashboard.html'; return }

        document.getElementById('loading').style.display = 'none'
        document.getElementById('bc-nome').textContent = caixinha.nome
        document.title = caixinha.nome + ' — wonuskiz-mail'

        // Header
        const cfg = STATUS_CFG[caixinha.status] || STATUS_CFG.accumulating
        document.getElementById('h-comunidade').textContent = (caixinha.comunidade || '') + ' ✦'
        document.getElementById('h-nome').textContent = caixinha.nome
        document.getElementById('h-status').innerHTML = `<span class="stamp ${cfg.cls}">${cfg.label}</span>`
        document.getElementById('h-data-pedido').textContent = formatDate(caixinha.data_pedido) || '—'
        document.getElementById('h-tipo-envio').textContent = caixinha.tipo_envio || '—'
        document.getElementById('h-transportadora').textContent = caixinha.transportadora || '—'
        // Rastreio: link salmon ou dash
        const rastreioWrap = document.getElementById('h-rastreio-wrap')
        if (caixinha.codigo_rastreio) {
          const correiosUrl = `https://rastreamento.correios.com.br/app/index.php?P_LINGUA=001&P_TIPO=001&P_COD_UNI=${caixinha.codigo_rastreio}`
          rastreioWrap.innerHTML = `<a href="${correiosUrl}" target="_blank" class="cx-rastreio-code">${caixinha.codigo_rastreio}<svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M10 6H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg></a><span class="cx-rastreio-status" id="h-rastreio-status"></span>`
        } else {
          rastreioWrap.textContent = '—'
        }
        document.getElementById('edit-link').href = `nova-caixinha.html?id=${caixinhaId}`
        document.getElementById('new-item-link').href = `novo-item.html?caixinha_id=${caixinhaId}`
        document.getElementById('empty-new-item').href = `novo-item.html?caixinha_id=${caixinhaId}`

        // Type chips
        const tipoCounts = {}
        itens.forEach(i => { tipoCounts[i.tipo_item] = (tipoCounts[i.tipo_item] || 0) + (i.quantidade || 1) })
        const cegsUnicas = new Set(itens.map(i => i.nome_ceg)).size
        document.getElementById('h-chips').innerHTML =
          Object.entries(tipoCounts).map(([t,q]) => `<div class="gom-chip"><strong>${q}</strong> ${t}${q>1?'s':''}</div>`).join('') +
          `<div class="gom-chip"><strong>${cegsUnicas}</strong> CEG${cegsUnicas!==1?'s':''}</div>`

        document.getElementById('caixinha-header').style.display = 'block'

        if (itens.length === 0) {
          document.getElementById('empty-items').style.display = 'block'
          return
        }

        document.getElementById('items-section').style.display = 'block'
        renderAcc()
        renderGrid()
        setView(currentView)
        restoreNavState()

        if (caixinha.transportadora === 'Correios' && caixinha.codigo_rastreio) loadRastreamento()
        else if (!caixinha.codigo_rastreio) {
          const cell = document.getElementById('h-tipo-envio-cell')
          if (cell && (!caixinha.tipo_envio)) cell.style.display = 'none'
        }
      } catch(e) {
        console.error(e)
        document.getElementById('loading').innerHTML = '<i class="ti ti-alert-circle"></i> Erro ao carregar'
      }
    }

    function groupItens() {
      const groups = {}
      itens.forEach(item => {
        const ceg = item.tipo_ceg || 'Outros'
        const nome = item.nome_ceg || '—'
        const set = item.nome_set || '—'
        if (!groups[ceg]) groups[ceg] = {}
        if (!groups[ceg][nome]) groups[ceg][nome] = {}
        if (!groups[ceg][nome][set]) groups[ceg][nome][set] = []
        groups[ceg][nome][set].push(item)
      })
      return groups
    }

    function renderAcc() {
      const groups = groupItens()
      const container = document.getElementById('acc-view')
      container.innerHTML = ''
      Object.entries(groups).forEach(([tipoCeg, nomes]) => {
        Object.entries(nomes).forEach(([nomeCeg, sets]) => {
          const allItems = Object.values(sets).flat()
          const totalQtd = allItems.reduce((s, i) => s + (i.quantidade || 1), 0)
          const thumbs = allItems.slice(0,4).map(i =>
            `<div class="acc-thumb">${i.foto_url ? `<img src="${i.foto_url}">` : '<i class="ti ti-photo"></i>'}</div>`
          ).join('')
          const more = allItems.length > 4 ? `<span class="acc-more">+${allItems.length-4}</span>` : ''
          const subsecs = Object.entries(sets).map(([setName, setItems]) => {
            const setQtd = setItems.reduce((s, i) => s + (i.quantidade || 1), 0)
            return `
            <div class="subsec">
              <div class="subsec-label">${setName} <span class="subsec-count">${setQtd}</span></div>
              <div class="items-grid-exp">${setItems.map(i => itemCardExpHTML(i, true)).join('')}</div>
            </div>`
          }).join('')
          const el = document.createElement('div')
          el.className = 'acc-item'
          el.dataset.nomeCeg = nomeCeg
          el.innerHTML = `
            <div class="acc-header" onclick="toggleAccItem(this)">
              <div class="acc-header-left">
                <div class="acc-ceg-tag">${tipoCeg}</div>
                <div class="acc-title">${nomeCeg}</div>
                <div class="acc-preview">${thumbs}${more}</div>
              </div>
              <div class="acc-header-right">
                <span class="acc-count">${totalQtd} itens</span>
                <i class="ti ti-chevron-down acc-arrow"></i>
              </div>
            </div>
            <div class="acc-body">${subsecs}</div>`
          container.appendChild(el)
        })
      })
    }

    function renderGrid() {
      document.getElementById('grid-view').innerHTML =
        '<div class="items-grid-exp">' + itens.map(i => itemCardExpHTML(i, true)).join('') + '</div>'
    }

    function saveNavState() {
      // descobre qual accordion está aberto e o scroll atual
      const openAcc = document.querySelector('.acc-item .acc-body.open')
      const nomeCeg = openAcc ? openAcc.closest('.acc-item')?.dataset.nomeCeg : null
      try {
        sessionStorage.setItem('wm-nav-' + caixinhaId, JSON.stringify({
          nomeCeg,
          scrollY: window.scrollY
        }))
      } catch {}
    }

    function restoreNavState() {
      try {
        const raw = sessionStorage.getItem('wm-nav-' + caixinhaId)
        if (!raw) return
        sessionStorage.removeItem('wm-nav-' + caixinhaId)
        const state = JSON.parse(raw)
        if (state.nomeCeg) {
          const accEl = document.querySelector(`.acc-item[data-nome-ceg="${CSS.escape(state.nomeCeg)}"]`)
          if (accEl) {
            const header = accEl.querySelector('.acc-header')
            if (header) toggleAccItem(header)
          }
        }
        if (state.scrollY) {
          requestAnimationFrame(() => window.scrollTo({ top: state.scrollY, behavior: 'instant' }))
        }
      } catch {}
    }

    function toggleAccItem(header) {
      const body = header.nextElementSibling
      const arrow = header.querySelector('.acc-arrow')
      const preview = header.querySelector('.acc-preview')
      const isOpen = body.classList.contains('open')
      body.classList.toggle('open', !isOpen)
      arrow.classList.toggle('open', !isOpen)
      if (preview) preview.style.display = isOpen ? 'flex' : 'none'
    }

    function setView(v) {
      currentView = v
      localStorage.setItem('wm-item-view', v)
      document.getElementById('acc-view').style.display = v === 'acc' ? 'block' : 'none'
      const gv = document.getElementById('grid-view')
      if (v === 'grid') { gv.classList.remove('h'); gv.style.display = 'grid' }
      else { gv.classList.add('h') }
      document.getElementById('btn-acc').classList.toggle('active', v === 'acc')
      document.getElementById('btn-grid').classList.toggle('active', v === 'grid')
    }



    async function loadRastreamento() {
      const status = await Sheets.getRastreamento(caixinha.codigo_rastreio)
      const statusEl = document.getElementById('h-rastreio-status')
      if (status && statusEl) {
        statusEl.textContent = status.status + (status.data ? ' · ' + status.data : '')
      }
    }

    function copyPublicLink() {
      const sheetId = localStorage.getItem('wm-sheet-id') || Sheets.spreadsheetId
      if (!sheetId) {
        showToast('ID da planilha não encontrado. Faça logout e login novamente.', 'error')
        return
      }
      const basePath = location.pathname.replace(/\/[^/]*$/, '')
      const url = location.origin + basePath + '/caixinha-publica.html?id=' + caixinhaId + '&sheet=' + sheetId
      copyToClipboard(url)
    }

    load()
  </script>
</body>
</html>
