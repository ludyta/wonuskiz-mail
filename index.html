<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wonuskiz-mail</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
</head>
<body class="dark">
  <div class="login-page">
    <div class="login-card">
      <div class="login-logo">✦ wonuskiz</div>
      <p class="login-sub">seus pedidos de envio nacional, organizadinhos</p>

      <div id="no-setup" style="display:none;margin-bottom:20px">
        <div style="background:var(--sf2);border:1.5px solid var(--bo);border-radius:10px;padding:14px 16px;font-size:13px;color:var(--ts);margin-bottom:12px;line-height:1.5">
          <i class="ti ti-settings"></i> Parece que é seu primeiro acesso! Faça o setup antes de entrar.
        </div>
        <a href="setup.html" class="btn btn-primary" style="width:100%;justify-content:center">
          <i class="ti ti-rocket"></i> Fazer setup
        </a>
      </div>

      <button class="login-btn" id="login-btn" onclick="Auth.login()">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" fill="#4285F4"/>
          <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z" fill="#34A853"/>
          <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
          <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
        </svg>
        Entrar com Google
      </button>

      <p style="font-size:12px;color:var(--ts);margin-top:20px;line-height:1.5">
        Ao entrar, você autoriza o acesso ao Google Sheets para salvar seus dados.
      </p>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/sheets.js"></script>
  <script src="js/auth.js"></script>
  <script>
    Theme.init()
    if (Auth.isLoggedIn()) window.location.href = 'dashboard.html'
    if (!Auth.CLIENT_ID) {
      document.getElementById('no-setup').style.display = 'block'
      document.getElementById('login-btn').style.opacity = '0.4'
      document.getElementById('login-btn').style.pointerEvents = 'none'
    } else {
      Auth.init()
    }
  </script>
</body>
</html>
