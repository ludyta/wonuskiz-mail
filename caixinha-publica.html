<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Envio — wonuskiz-mail</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
</head>
<body class="dark">
  <nav class="navbar">
    <span class="navbar-logo">wonuskiz <span class="navbar-badge">mail ✦</span></span>
    <div class="navbar-links">
      <button class="theme-toggle" id="theme-toggle" onclick="Theme.toggle()"><i class="ti ti-sun"></i><span>light</span></button>
    </div>
  </nav>

  <div class="main">
    <div id="loading" class="loading"><i class="ti ti-loader ti-spin"></i> Carregando...</div>

    <div id="gom-header" style="display:none">
      <div class="gom-hero">
        <div class="gom-owner" id="g-owner">✦</div>
        <div class="gom-title" id="g-nome"></div>
        <div class="gom-chips" id="g-chips"></div>
      </div>
    </div>

    <div class="section" id="items-section" style="display:none">
      <div class="section-header">
        <div class="section-label">itens do envio</div>
        <div class="view-toggle">
          <button class="vt-btn active" id="btn-acc" onclick="setView('acc')"><i class="ti ti-layout-list"></i></button>
          <button class="vt-btn" id="btn-grid" onclick="setView('grid')"><i class="ti ti-layout-grid"></i></button>
        </div>
      </div>
      <div id="acc-view"></div>
      <div id="grid-view" class="items-grid h"></div>
    </div>

    <div id="empty" class="empty-state" style="display:none">
      <div class="empty-icon"><i class="ti ti-package"></i></div>
      <div class="empty-title">Nenhum item ainda</div>
      <div class="empty-sub">Esta caixinha ainda não tem itens cadastrados.</div>
    </div>

    <div id="error" class="empty-state" style="display:none">
      <div class="empty-icon"><i class="ti ti-alert-circle"></i></div>
      <div class="empty-title">Caixinha não encontrada</div>
      <div class="empty-sub">Verifique se o link está correto.</div>
    </div>

    <div class="orn">✦ &nbsp; wonuskiz mail &nbsp; ♡</div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/theme.js"></script>
  <script>
    Theme.init()
    const params = new URLSearchParams(location.search)
    const caixinhaId = params.get('id')
    const publicSheetId = params.get('sheet')
    let currentView = 'acc'

    async function load() {
      if (!caixinhaId || !publicSheetId) { showError(); return }
      try {
        const url = `https://docs.google.com/spreadsheets/d/${publicSheetId}/gviz/tq?tqx=out:json&sheet=`
        async function readSheet(name) {
          const res = await fetch(url + encodeURIComponent(name))
          const text = await res.text()
          const json = JSON.parse(text.substring(47, text.length - 2))
          return json.table.rows.map(r => r.c.map(c => c ? (c.v !== null && c.v !== undefined ? String(c.v) : '') : ''))
        }
        const [caixinhasRows, itensRows, configRows] = await Promise.all([
          readSheet('Caixinhas'),
          readSheet('Itens'),
          readSheet('Config')
        ])
        const caixinha = caixinhasRows.find(r => r[0] === caixinhaId)
        if (!caixinha) { showError(); return }
        const itens = itensRows.filter(r => r[0] && r[1] === caixinhaId).map(r => ({
          id:r[0], caixinha_id:r[1], foto_url:r[2], tipo_item:r[3], tipo_ceg:r[4],
          nome_ceg:r[5], nome_set:r[6], linha_ref:r[7], claim:r[8],
          quantidade:parseInt(r[9])||1, separado:r[10]==='TRUE', claims:r[12]||''
        }))

        // Lê nome e @ do perfil da aba Config
        let perfilNome = '', perfilHandle = ''
        configRows.forEach(r => {
          if (r[0] === 'perfil_nome') perfilNome = r[1] || ''
          if (r[0] === 'perfil_handle') perfilHandle = r[1] || ''
        })
        const ownerParts = [perfilNome, perfilHandle].filter(Boolean)
        document.getElementById('g-owner').textContent = (ownerParts.length ? ownerParts.join(' · ') : 'wonuskiz') + ' ✦'

        document.getElementById('loading').style.display = 'none'
        document.getElementById('g-nome').textContent = caixinha[1] || 'Envio'

        const tipoCounts = {}
        itens.forEach(i => { tipoCounts[i.tipo_item] = (tipoCounts[i.tipo_item] || 0) + (i.quantidade||1) })
        const cegsUnicas = new Set(itens.map(i => i.nome_ceg)).size
        document.getElementById('g-chips').innerHTML =
          Object.entries(tipoCounts).map(([t,q]) => `<div class="gom-chip"><strong>${q}</strong> ${t}${q>1?'s':''}</div>`).join('') +
          `<div class="gom-chip"><strong>${cegsUnicas}</strong> CEG${cegsUnicas!==1?'s':''}</div>`
        document.getElementById('gom-header').style.display = 'block'

        if (itens.length === 0) { document.getElementById('empty').style.display = 'block'; return }

        document.getElementById('items-section').style.display = 'block'
        renderAcc(itens)
        renderGrid(itens)
        setView('acc')
      } catch(e) { console.error(e); showError() }
    }

    function showError() {
      document.getElementById('loading').style.display = 'none'
      document.getElementById('error').style.display = 'block'
    }

    function renderAcc(itens) {
      const groups = {}
      itens.forEach(item => {
        const ceg = item.tipo_ceg || 'Outros'
        const nome = item.nome_ceg || '—'
        const set = item.nome_set || '—'
        if (!groups[ceg]) groups[ceg] = {}
        if (!groups[ceg][nome]) groups[ceg][nome] = {}
        if (!groups[ceg][nome][set]) groups[ceg][nome][set] = []
        groups[ceg][nome][set].push(item)
      })
      const container = document.getElementById('acc-view')
      container.innerHTML = ''
      Object.entries(groups).forEach(([tipoCeg, nomes]) => {
        Object.entries(nomes).forEach(([nomeCeg, sets]) => {
          const allItems = Object.values(sets).flat()
          const totalQtd = allItems.reduce((s, i) => s + (i.quantidade || 1), 0)
          const thumbs = allItems.slice(0,4).map(i =>
            `<div class="acc-thumb">${i.foto_url ? `<img src="${i.foto_url}">` : '<i class="ti ti-photo"></i>'}</div>`
          ).join('')
          const more = allItems.length > 4 ? `<span class="acc-more">+${allItems.length-4}</span>` : ''
          const subsecs = Object.entries(sets).map(([setName, setItems]) => {
            const setQtd = setItems.reduce((s, i) => s + (i.quantidade || 1), 0)
            return `
            <div class="subsec">
              <div class="subsec-label">${setName} <span class="subsec-count">${setQtd}</span></div>
              <div class="items-grid-exp">${setItems.map(i => itemCardExpHTML(i, false)).join('')}</div>
            </div>`
          }).join('')
          const el = document.createElement('div')
          el.className = 'acc-item'
          el.innerHTML = `
            <div class="acc-header" onclick="toggleAccItem(this)">
              <div class="acc-header-left">
                <div class="acc-ceg-tag">${tipoCeg}</div>
                <div class="acc-title">${nomeCeg}</div>
                <div class="acc-preview">${thumbs}${more}</div>
              </div>
              <div class="acc-header-right">
                <span class="acc-count">${totalQtd} itens</span>
                <i class="ti ti-chevron-down acc-arrow"></i>
              </div>
            </div>
            <div class="acc-body">${subsecs}</div>`
          container.appendChild(el)
        })
      })
    }

    function renderGrid(itens) {
      document.getElementById('grid-view').innerHTML =
        '<div class="items-grid-exp">' + itens.map(i => itemCardExpHTML(i, false)).join('') + '</div>'
    }

    function toggleAccItem(header) {
      const body = header.nextElementSibling
      const arrow = header.querySelector('.acc-arrow')
      const preview = header.querySelector('.acc-preview')
      const isOpen = body.classList.contains('open')
      body.classList.toggle('open', !isOpen)
      arrow.classList.toggle('open', !isOpen)
      if (preview) preview.style.display = isOpen ? 'flex' : 'none'
    }

    function setView(v) {
      currentView = v
      document.getElementById('acc-view').style.display = v === 'acc' ? 'block' : 'none'
      const gv = document.getElementById('grid-view')
      if (v === 'grid') { gv.classList.remove('h'); gv.style.display = 'grid' }
      else gv.classList.add('h')
      document.getElementById('btn-acc').classList.toggle('active', v === 'acc')
      document.getElementById('btn-grid').classList.toggle('active', v === 'grid')
    }

    load()
  </script>
</body>
</html>
